name: boivirtual
description: "A new Flutter project."
publish_to: 'none'

# O build number (depois do "+") é MÊS+DIA+HORA+MINUTO da build, formato
# MMDDHHmm (sem ano: o Android exige que isso caiba num inteiro de 32 bits,
# até ~2,1 bilhões — com ano dava overflow e o build falhava) — atualizar
# sempre que uma build nova for gerada pra teste (a hora importa: pode sair
# mais de uma build no mesmo dia), é assim que o testador confirma na tela
# "Atualizações" qual versão está rodando no aparelho.
version: 2.0.0+09031703

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7
  connectivity_plus: ^7.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.4
  shelf: ^1.4.2 # servidor HTTP local de mentira p/ testes de rede ruim

# Configuração do Ícone do App
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#18385F"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: FuturaStd
      fonts:
        - asset: assets/fonts/FuturaStd-Light.otf

# Configuração do Splash
flutter_native_splash:
  color: "#18385F"
  image: assets/images/logo_foreground.png

  android_12:
    color: "#18385F"
    image: assets/images/logo_foreground.png