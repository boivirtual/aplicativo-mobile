name: boivirtual
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Configuração do Ícone do App
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#18385F"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: FuturaStd
      fonts:
        - asset: assets/fonts/FuturaStd-Light.otf

# Configuração do Splash
flutter_native_splash:
  color: "#18385F"
  image: assets/images/logo_foreground.png

  android_12:
    color: "#18385F"
    image: assets/images/logo_foreground.png